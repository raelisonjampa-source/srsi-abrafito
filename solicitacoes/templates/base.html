<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>SRSI - ABRAFITO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body.alto-contraste {
      background-color: #000 !important;
      color: #fff !important;
    }
    body.alto-contraste a,
    body.alto-contraste label,
    body.alto-contraste h1,
    body.alto-contraste h2,
    body.alto-contraste h3,
    body.alto-contraste strong {
      color: #ffff00 !important;
    }
    body.alto-contraste .btn,
    body.alto-contraste input,
    body.alto-contraste select,
    body.alto-contraste textarea {
      background-color: #000 !important;
      color: #fff !important;
      border: 2px solid #fff !important;
    }
    body.alto-contraste .text-muted {
      color: #ccc !important;
    }
    body.alto-contraste .alert-success {
      background-color: #003300 !important;
      color: #00ff00 !important;
      border: 2px solid #00ff00 !important;
    }
    #toggle-contraste {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <button id="toggle-contraste" class="btn btn-outline-secondary btn-sm" aria-pressed="false">
    Ativar alto contraste
  </button>

  {% block content %}{% endblock %}

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.getElementById('toggle-contraste');
      const body = document.body;

      if (localStorage.getItem('altoContraste') === 'ativado') {
        body.classList.add('alto-contraste');
        btn.setAttribute('aria-pressed', 'true');
        btn.textContent = 'Desativar alto contraste';
      }

      btn.addEventListener('click', function () {
        body.classList.toggle('alto-contraste');
        const ativo = body.classList.contains('alto-contraste');
        btn.setAttribute('aria-pressed', ativo);
        btn.textContent = ativo ? 'Desativar alto contraste' : 'Ativar alto contraste';
        localStorage.setItem('altoContraste', ativo ? 'ativado' : 'desativado');
      });
    });
  </script>

</body>
</html>
